[project]
name = "voidgrid"
version = "0.1.0"
description = "A living digital third place: fresh discoveries, regulars who remember you, and loved ones who drop by. MCP-first."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
voidgrid-mcp = "voidgrid.mcp_server:main"
voidgrid-web = "voidgrid.web:main"
voidgrid-demo = "voidgrid.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voidgrid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
